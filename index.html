<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist de Prontuário - Santa Casa de Rondonópolis</title>
  <style>
    :root {
      --ink: #17324a;
      --brand: #2d5fad;
      --navy: #1c3f7a;
      --navy-dark: #17324a;
      --sky: #e6f4f8;
      --line: #e3e3e3;
      --danger: #d64545;
      --danger-bg: #fdecea;
      --green: #2b7a4b;
      --green-bg: #dcefe1;
      --orange: #e07b24;
      --orange-bg: #fff6e9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #edf2f6; }
    body { min-width: 320px; font-family: "Museo Sans Rounded", "Arial Rounded MT Bold", Arial, Helvetica, sans-serif; background: #edf2f6; color: var(--ink); padding: 24px 16px 40px; }
    button, select, input { font: inherit; }
    .app-toolbar { width: min(100%, 210mm); margin: 0 auto 14px; }
    .selector-wrapper { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,.94); border: 1px solid #d7e2eb; border-radius: 12px; box-shadow: 0 4px 16px rgba(23,50,74,.08); }
    .selector-wrapper label { font-size: 13px; font-weight: 900; color: var(--navy); white-space: nowrap; }
    .selector-wrapper select { flex: 1; min-width: 0; padding: 9px 36px 9px 12px; border: 1px solid #9ab3c8; border-radius: 8px; background: #fff; color: var(--ink); font-size: 13px; cursor: pointer; }
    .container { width: min(100%, 210mm); min-height: 297mm; margin: 0 auto; background: #fff; padding: 16mm 16.2mm 14mm; box-shadow: 0 12px 40px rgba(23,50,74,.14); }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 14px; }
    .header-copy { min-width: 0; padding-top: 2px; }
    h1 { color: var(--brand); font-size: 45px; line-height: .92; letter-spacing: .6px; font-weight: 900; }
    .checklist-subtitle { margin-top: 9px; color: var(--brand); font-size: 16px; line-height: 1.25; font-weight: 700; }
    .logo-wrapper { width: 185px; display: flex; justify-content: flex-end; }
    .logo-wrapper img { display: block; width: 175px; max-width: 100%; height: auto; }
    .info-box { margin-bottom: 14px; padding: 12px 15px 12px 18px; background: var(--sky); border-left: 5px solid var(--navy-dark); border-radius: 0 8px 8px 0; font-size: 12.5px; line-height: 1.42; }
    .guidance-list { list-style: none; display: grid; gap: 2px; }
    .guidance-item { position: relative; padding-left: 13px; }
    .guidance-item::before { content: "▲"; position: absolute; left: 0; top: .08em; color: var(--danger); font-size: 7px; }
    .notice-box { margin: 7px 0 10px; padding: 7px 10px; border: 1.5px dashed var(--danger); border-radius: 6px; background: var(--danger-bg); color: var(--ink); font-size: 12px; line-height: 1.38; }
    .notice-box strong { color: var(--danger); font-weight: 900; }
    .checklist-intro-notice { margin: 0 0 12px; }
    .checklist-content { display: block; }
    .section { margin: 0 0 13px; break-inside: auto; }
    .section-title { display: flex; align-items: center; min-height: 36px; margin-bottom: 5px; padding: 5px 14px 5px 7px; border-radius: 999px; background: linear-gradient(90deg, #30579b 0%, var(--navy) 100%); color: #fff; font-size: 14px; line-height: 1.2; font-weight: 900; }
    .section-number { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; min-width: 22px; margin-right: 10px; border-radius: 50%; background: var(--navy-dark); color: #fff; font-size: 11px; }
    .items-list { list-style: none; }
    .item { display: block; border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.35; }
    .item-row { display: flex; align-items: flex-start; gap: 10px; width: 100%; min-height: 30px; padding: 7px 2px 7px 0; border: 0; border-radius: 4px; background: transparent; color: inherit; text-align: left; cursor: pointer; }
    .item-row:hover, .item-row:focus-visible { background: #f5f9fd; }
    .item-row:hover .item-main, .item-row:focus-visible .item-main { color: var(--brand); }
    .item-row:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .item-circle { width: 11px; height: 11px; min-width: 11px; margin: 2px 0 0 1px; border: 1.5px solid var(--brand); border-radius: 50%; background: #fff; transition: background-color .15s ease, box-shadow .15s ease; }
    .item.active .item-circle { background: var(--brand); box-shadow: inset 0 0 0 2.5px #fff; }
    .item-copy { min-width: 0; flex: 1; }
    .item-main { transition: color .15s ease; }
    .item-main strong { font-weight: 900; }
    .item-tags { display: inline-flex; flex-wrap: wrap; gap: 3px; margin-left: 5px; vertical-align: 1px; }
    .payer-tag { display: inline-flex; align-items: center; min-height: 16px; padding: 1px 5px; border-radius: 4px; background: var(--green-bg); color: var(--green); font-size: 10px; line-height: 1.05; font-weight: 900; text-transform: uppercase; }
    .item-note { display: block; margin-top: 3px; padding-left: 15px; color: var(--brand); font-size: 11px; line-height: 1.35; }
    .item-note::before { content: "⚑"; float: left; margin-left: -15px; color: var(--orange); font-size: 11px; }
    .stage { margin: 12px 0 14px; }
    .stage-title { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 7px 10px; border-left: 5px solid var(--orange); border-radius: 0 6px 6px 0; background: var(--orange-bg); color: var(--ink); font-size: 15px; font-weight: 900; }
    .stage-check { width: 11px; height: 11px; border: 1.5px solid var(--ink); border-radius: 2px; background: #fff; }
    .stage-description { margin: 5px 0; padding: 8px 12px; border-radius: 5px; background: var(--sky); font-size: 12.5px; line-height: 1.42; }
    .modal-overlay { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; padding: 22px; background: rgba(23, 50, 74, .76); }
    .modal-overlay.show { display: flex; }
    .modal-content { width: min(2000px, 96vw); max-height: 92vh; overflow: hidden; background: #fff; border-radius: 18px; box-shadow: 0 24px 70px rgba(0,0,0,.36); display: flex; flex-direction: column; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 18px; border-bottom: 1px solid #e7edf3; background: #f8fbfe; }
    .modal-title { color: var(--navy); font-size: 15px; font-weight: 900; line-height: 1.25; }
    .modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .modal-action, .modal-close { border: 0; border-radius: 999px; background: var(--navy); color: #fff; font-weight: 900; padding: 9px 13px; cursor: pointer; font-size: 13px; }
    .modal-action.secondary { background: #e8f1f8; color: var(--navy); border: 1px solid #bed6e8; }
    .modal-action.upload { background: var(--brand); color: #fff; }
    #imageFileInput { display: none; }
    .modal-action:hover, .modal-action:focus-visible, .modal-close:hover, .modal-close:focus-visible { background: var(--navy-dark); color: #fff; }
    .zoom-value { min-width: 52px; text-align: center; color: var(--navy); font-size: 13px; font-weight: 900; }
    .modal-body { padding: 18px; background: #fff; overflow: auto; }
    .modal-images { width: 100%; }
    .image-carousel { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 4px 12px; }
    .image-carousel.zoomed { overflow-x: hidden; scroll-snap-type: none; }
    .image-frame { flex: 0 0 100%; scroll-snap-align: center; border: 1px solid #dfe8f0; border-radius: 14px; background: #f8fbfe; padding: 10px; min-height: 220px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; cursor: zoom-in; touch-action: pan-x; }
    .image-frame.is-zoomed { cursor: grab; touch-action: none; }
    .image-frame.is-dragging { cursor: grabbing; }
    .image-frame img { display: block; width: 100%; max-height: 68vh; object-fit: contain; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.12); background: #fff; transform-origin: center center; transition: transform .12s ease; will-change: transform; user-select: none; -webkit-user-drag: none; }
    .image-frame.is-dragging img { transition: none; }
    .image-frame .image-error { display: none; width: 100%; padding: 42px 18px; border: 2px dashed var(--brand); border-radius: 12px; color: var(--navy); text-align: center; font-weight: 700; }
    .carousel-toolbar { display: none; align-items: center; justify-content: center; gap: 12px; margin-top: 10px; }
    .carousel-toolbar.show { display: flex; }
    .carousel-toolbar button { border: 0; border-radius: 999px; background: var(--navy); color: #fff; font-weight: 900; padding: 9px 14px; cursor: pointer; }
    .carousel-toolbar button:hover, .carousel-toolbar button:focus-visible { background: var(--navy-dark); }
    .carousel-hint { color: #5b6872; font-size: 12px; font-weight: 700; }
    .modal-caption { padding: 12px 18px 18px; color: #444; font-size: 13px; line-height: 1.4; background: #fff; border-top: 1px solid #eef2f5; }
    .modal-fallback { display: none; width: 100%; padding: 48px 22px; border: 2px dashed var(--brand); border-radius: 14px; background: #f4f9fd; color: var(--navy); text-align: center; font-weight: 700; }
    footer { margin-top: 18px; font-size: 12.5px; color: var(--ink); }
    .footer-field { display: flex; align-items: center; gap: 10px; margin: 11px 0; }
    .footer-field label { white-space: nowrap; color: #333; }
    .footer-field .line { height: 1px; border-bottom: 1px solid var(--navy-dark); flex: 1; }
    @media (max-width: 760px) {
      body { padding: 10px 8px 24px; }
      .app-toolbar { margin-bottom: 8px; }
      .selector-wrapper { align-items: stretch; flex-direction: column; gap: 7px; }
      .container { min-height: 0; padding: 24px 18px 28px; }
      header { align-items: flex-start; flex-direction: column; gap: 14px; }
      h1 { font-size: clamp(30px, 10vw, 39px); }
      .checklist-subtitle { font-size: 10.5px; }
      .logo-wrapper { width: 135px; align-self: flex-end; }
      .footer-field { align-items: flex-start; flex-direction: column; }
      .footer-field .line { width: 100%; }
      .modal-header { align-items: flex-start; flex-direction: column; }
      .modal-actions { justify-content: flex-start; }
      .modal-action, .modal-close { padding: 8px 10px; font-size: 12px; }
    }
    @page { size: A4 portrait; margin: 16mm 16.2mm 14mm; }
    @media print {
      body { background: #fff; padding: 0; }
      .app-toolbar { display: none; }
      .container { box-shadow: none; max-width: none; width: 100%; min-height: auto; padding: 0; }
      header, .info-box, .section-title, .notice-box, .payer-tag, .stage-title, .stage-description { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .section-title, .stage-title, .stage-description { break-after: avoid-page; page-break-after: avoid; }
      .section-title + .notice-box, .items-list .item:first-child { break-before: avoid-page; page-break-before: avoid; }
      .item { break-inside: avoid; }
      .item-row { cursor: default; }
      .modal-overlay { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-toolbar" aria-label="Seleção do checklist">
    <div class="selector-wrapper">
      <label for="checklistType">Tipo de prontuário</label>
      <select id="checklistType">
        <option value="cirurgico">Prontuário Cirúrgico</option>
        <option value="clinico">Prontuário Clínico</option>
        <option value="clinico-rn">Prontuário Clínico - RN</option>
        <option value="obstetrico">Prontuário Obstétrico</option>
        <option value="pa">Pronto Atendimento (PA)</option>
        <option value="ambulatorial-consulta">Ambulatorial — Consulta</option>
        <option value="ambulatorial-exames">Ambulatorial — Exames</option>
        <option value="ambulatorial-cirurgia">Ambulatorial — Cirurgia Ambulatorial</option>
        <option value="uti">Unidade Intensiva (UTI)</option>
        <option value="oncologico">Ambulatorial – Oncológico</option>
      </select>
    </div>
  </div>

  <div class="container">
    <header>
      <div class="header-copy">
        <h1>CHECKLIST</h1>
        <p id="checklistSubtitle" class="checklist-subtitle">Revisão de Prontuário — Prontuário Cirúrgico</p>
      </div>
      <div class="logo-wrapper"><img src="imagens/logo.png" alt="Santa Casa Rondonópolis" /></div>
    </header>

    <div id="infoBox" class="info-box"></div>
    <div id="noticeBox"></div>
    <main id="checklistContent" class="checklist-content"></main>

    <footer>
      <div class="footer-field"><label>Responsável pela conferência:</label><div class="line"></div></div>
      <div class="footer-field"><label>Data / Horário:</label><div class="line"></div></div>
    </footer>
  </div>


  <div id="imageModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div id="modalTitle" class="modal-title">Imagem do item selecionado</div>
        <div class="modal-actions" aria-label="Controles da imagem">
          <button type="button" id="zoomOut" class="modal-action secondary" title="Diminuir zoom">−</button>
          <span id="zoomValue" class="zoom-value">100%</span>
          <button type="button" id="zoomIn" class="modal-action secondary" title="Aumentar zoom">+</button>
          <button type="button" id="zoomReset" class="modal-action secondary" title="Restaurar imagem">Ajustar</button>
          <button type="button" id="addImageBtn" class="modal-action upload" title="Adicionar nova imagem ao item">Adicionar imagem</button>
          <button type="button" id="replaceImageBtn" class="modal-action secondary" title="Substituir a imagem atual">Substituir atual</button>
          <button type="button" id="removeCustomImageBtn" class="modal-action secondary" title="Remover a imagem personalizada atual">Remover personalizada</button>
          <input type="file" id="imageFileInput" accept="image/*" multiple />
          <button type="button" id="modalClose" class="modal-close">Voltar</button>
        </div>
      </div>
      <div class="modal-body">
        <div id="modalImages" class="modal-images"></div>
        <div id="modalFallback" class="modal-fallback">Imagem não encontrada para este item.</div>
        <div id="carouselToolbar" class="carousel-toolbar" aria-label="Navegação do carrossel">
          <button type="button" id="carouselPrev">Anterior</button>
          <span class="carousel-hint">Arraste para o lado ou use os botões</span>
          <button type="button" id="carouselNext">Próxima</button>
        </div>
      </div>
      <div id="modalCaption" class="modal-caption"></div>
    </div>
  </div>

  <script src="checklist-assets.js"></script>
  <script src="checklist-data.js"></script>
  <script>
    const guidanceItems = window.CHECKLIST_GUIDANCE || [];
    const checklists = window.CHECKLIST_DATA || {};

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getItemText(item) {
      return typeof item === "string" ? item : item.text;
    }

    function itemHtml(item) {
      const text = getItemText(item);
      const safe = escapeHtml(text);
      return typeof item === "object" && item.bold ? `<strong>${safe}</strong>` : safe;
    }

    function normalizeText(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[–—]/g, "-")
        .replace(/[^a-z0-9\s-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }


    const imageGroups = window.CHECKLIST_IMAGE_GROUPS || {};

    function getItemImages(type, item) {
      const typeGroups = imageGroups[type] || {};
      const sources = (item && item.imageGroups ? item.imageGroups : []).flatMap((group) => typeGroups[group] || []);
      return Array.from(new Set(sources));
    }

    function findChecklistItem(type, itemId) {
      const checklist = checklists[type];
      if (!checklist) return null;
      for (const section of checklist.sections || []) {
        const item = (section.items || []).find((entry) => entry.id === itemId);
        if (item) return item;
      }
      return null;
    }

    function getReferenceData(type, item) {
      if (!item) return { title: "Documento do checklist", images: [] };
      return {
        title: item.imageTitle || item.text || "Documento do checklist",
        images: getItemImages(type, item)
      };
    }

    const EDIT_IMAGE_PASSWORD = "1234";

    function requestImageEditPassword(actionLabel) {
      const password = window.prompt(`Digite a senha para ${actionLabel}:`);
      if (password === null) return false;
      if (password === EDIT_IMAGE_PASSWORD) return true;
      alert("Senha inválida. A alteração não foi realizada.");
      return false;
    }

    const CUSTOM_IMAGE_DB_NAME = "checklist-prontuario-imagens";
    const CUSTOM_IMAGE_DB_VERSION = 1;
    const CUSTOM_IMAGE_STORE = "imagensPorItem";
    const CUSTOM_IMAGE_STORAGE_PREFIX = "checklist-prontuario-imagem::";

    let currentModalState = null;
    let pendingImageAction = null;
    let modalRequestId = 0;

    function defaultCustomImageRecord() {
      return { additions: [], replacements: {} };
    }

    function normalizeCustomImageRecord(record) {
      return {
        additions: Array.isArray(record && record.additions) ? record.additions : [],
        replacements: record && typeof record.replacements === "object" && record.replacements ? record.replacements : {}
      };
    }

    function openChecklistImageDb() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB indisponível neste navegador."));
          return;
        }

        const request = window.indexedDB.open(CUSTOM_IMAGE_DB_NAME, CUSTOM_IMAGE_DB_VERSION);

        request.onupgradeneeded = function () {
          const db = request.result;
          if (!db.objectStoreNames.contains(CUSTOM_IMAGE_STORE)) {
            db.createObjectStore(CUSTOM_IMAGE_STORE);
          }
        };

        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { reject(request.error || new Error("Falha ao abrir o banco local de imagens.")); };
      });
    }

    async function getCustomImageRecord(itemKey) {
      try {
        const db = await openChecklistImageDb();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(CUSTOM_IMAGE_STORE, "readonly");
          const store = tx.objectStore(CUSTOM_IMAGE_STORE);
          const request = store.get(itemKey);
          request.onsuccess = function () {
            const record = request.result || defaultCustomImageRecord();
            resolve(normalizeCustomImageRecord(record));
          };
          request.onerror = function () { reject(request.error); };
          tx.oncomplete = function () { db.close(); };
          tx.onerror = function () { db.close(); };
        });
      } catch (error) {
        try {
          const raw = window.localStorage.getItem(CUSTOM_IMAGE_STORAGE_PREFIX + itemKey);
          return normalizeCustomImageRecord(raw ? JSON.parse(raw) : null);
        } catch (fallbackError) {
          console.warn("Não foi possível carregar imagens personalizadas.", error, fallbackError);
          return defaultCustomImageRecord();
        }
      }
    }

    async function saveCustomImageRecord(itemKey, record) {
      const normalizedRecord = normalizeCustomImageRecord(record);
      try {
        const db = await openChecklistImageDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(CUSTOM_IMAGE_STORE, "readwrite");
          const store = tx.objectStore(CUSTOM_IMAGE_STORE);
          store.put(normalizedRecord, itemKey);
          tx.oncomplete = function () { db.close(); resolve(); };
          tx.onerror = function () { db.close(); reject(tx.error); };
          tx.onabort = function () { db.close(); reject(tx.error); };
        });
        return;
      } catch (error) {
        try {
          window.localStorage.setItem(CUSTOM_IMAGE_STORAGE_PREFIX + itemKey, JSON.stringify(normalizedRecord));
          return;
        } catch (fallbackError) {
          console.error("Falha ao salvar imagem personalizada.", error, fallbackError);
          throw fallbackError;
        }
      }
    }

    function composeImageEntries(baseImages, customRecord) {
      const record = normalizeCustomImageRecord(customRecord);
      const replacements = record.replacements || {};
      const additions = record.additions || [];

      const baseEntries = (baseImages || []).map((src, index) => ({
        src: replacements[String(index)] || src,
        imageIndex: index,
        kind: replacements[String(index)] ? "replacement" : "base"
      }));

      const additionEntries = additions.map((src, index) => ({
        src,
        imageIndex: (baseImages || []).length + index,
        customIndex: index,
        kind: "addition"
      }));

      return baseEntries.concat(additionEntries);
    }

    function getCurrentImageIndex() {
      const frame = getCurrentFrame();
      if (!frame || frame.dataset.imageIndex === undefined) return null;
      const index = Number(frame.dataset.imageIndex);
      return Number.isFinite(index) ? index : null;
    }

    function readImageFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith("image/")) {
          reject(new Error("Selecione apenas arquivos de imagem."));
          return;
        }

        const reader = new FileReader();
        reader.onload = function () { resolve(reader.result); };
        reader.onerror = function () { reject(reader.error || new Error("Falha ao ler a imagem.")); };
        reader.readAsDataURL(file);
      });
    }

    function refreshCurrentModalImages() {
      if (!currentModalState) return;
      resetAllZoom();
      const entries = composeImageEntries(currentModalState.baseImages, currentModalState.customRecord);
      renderModalImages(entries, currentModalState.itemText);
    }

    function chooseImageFile(action) {
      if (!currentModalState) return;

      const actionLabel = action === "add" ? "adicionar imagem" : "substituir a imagem atual";
      if (!requestImageEditPassword(actionLabel)) return;

      pendingImageAction = action;
      const input = document.getElementById("imageFileInput");
      if (!input) return;
      input.value = "";
      input.multiple = action === "add";
      input.click();
    }

    async function handleSelectedImageFiles(files) {
      if (!currentModalState || !pendingImageAction || !files || !files.length) return;

      try {
        const selectedImages = await Promise.all(Array.from(files).map(readImageFileAsDataUrl));
        const record = normalizeCustomImageRecord(currentModalState.customRecord);

        if (pendingImageAction === "add") {
          record.additions.push(...selectedImages);
        }

        if (pendingImageAction === "replace") {
          const currentIndex = getCurrentImageIndex();
          if (currentIndex === null) {
            alert("Não há imagem atual para substituir. Use Adicionar imagem.");
            return;
          }

          if (currentIndex < currentModalState.baseImages.length) {
            record.replacements[String(currentIndex)] = selectedImages[0];
          } else {
            const additionIndex = currentIndex - currentModalState.baseImages.length;
            record.additions[additionIndex] = selectedImages[0];
          }
        }

        await saveCustomImageRecord(currentModalState.itemKey, record);
        currentModalState.customRecord = record;
        refreshCurrentModalImages();
      } catch (error) {
        console.error(error);
        alert("Não foi possível salvar a imagem selecionada. Tente uma imagem menor ou outro arquivo.");
      } finally {
        pendingImageAction = null;
      }
    }

    async function removeCurrentCustomImage() {
      if (!currentModalState) return;
      if (!requestImageEditPassword("remover a imagem personalizada")) return;
      const currentIndex = getCurrentImageIndex();
      if (currentIndex === null) {
        alert("Não há imagem personalizada selecionada para remover.");
        return;
      }

      const record = normalizeCustomImageRecord(currentModalState.customRecord);

      if (currentIndex < currentModalState.baseImages.length) {
        if (!record.replacements[String(currentIndex)]) {
          alert("A imagem atual é a imagem original do pacote. Use Substituir atual para trocar.");
          return;
        }
        delete record.replacements[String(currentIndex)];
      } else {
        const additionIndex = currentIndex - currentModalState.baseImages.length;
        if (additionIndex < 0 || additionIndex >= record.additions.length) return;
        record.additions.splice(additionIndex, 1);
      }

      try {
        await saveCustomImageRecord(currentModalState.itemKey, record);
        currentModalState.customRecord = record;
        refreshCurrentModalImages();
      } catch (error) {
        console.error(error);
        alert("Não foi possível remover a imagem personalizada.");
      }
    }

    const ZOOM_MIN = 1;
    const ZOOM_MAX = 5;
    const ZOOM_STEP = 0.25;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function getFrameState(frame) {
      return {
        scale: Number(frame.dataset.scale || 1),
        x: Number(frame.dataset.x || 0),
        y: Number(frame.dataset.y || 0)
      };
    }

    function saveFrameState(frame, state) {
      frame.dataset.scale = String(state.scale);
      frame.dataset.x = String(state.x);
      frame.dataset.y = String(state.y);
    }

    function getCurrentFrame() {
      const carousel = document.getElementById("imageCarousel");
      if (!carousel) return null;
      const frames = Array.from(carousel.querySelectorAll(".image-frame"));
      if (!frames.length) return null;
      const center = carousel.scrollLeft + carousel.clientWidth / 2;
      return frames.reduce((best, frame) => {
        const frameCenter = frame.offsetLeft + frame.clientWidth / 2;
        const distance = Math.abs(frameCenter - center);
        return !best || distance < best.distance ? { frame, distance } : best;
      }, null).frame;
    }

    function clampFramePan(frame, state) {
      if (state.scale <= 1) {
        state.x = 0;
        state.y = 0;
        return state;
      }
      const maxX = Math.max(0, (frame.clientWidth * (state.scale - 1)) / 2);
      const maxY = Math.max(0, (frame.clientHeight * (state.scale - 1)) / 2);
      state.x = clamp(state.x, -maxX, maxX);
      state.y = clamp(state.y, -maxY, maxY);
      return state;
    }

    function syncCarouselZoomState() {
      const carousel = document.getElementById("imageCarousel");
      if (!carousel) return;
      const hasZoomedFrame = Array.from(carousel.querySelectorAll(".image-frame")).some((frame) => getFrameState(frame).scale > 1);
      carousel.classList.toggle("zoomed", hasZoomedFrame);
    }

    function updateZoomValue(frame) {
      const zoomValue = document.getElementById("zoomValue");
      if (!zoomValue) return;
      const currentFrame = frame || getCurrentFrame();
      const scale = currentFrame ? getFrameState(currentFrame).scale : 1;
      zoomValue.textContent = `${Math.round(scale * 100)}%`;
    }

    function applyFrameTransform(frame) {
      if (!frame) return;
      const img = frame.querySelector("img");
      if (!img) return;
      const state = clampFramePan(frame, getFrameState(frame));
      saveFrameState(frame, state);
      img.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
      frame.classList.toggle("is-zoomed", state.scale > 1);
      syncCarouselZoomState();
      updateZoomValue(frame);
    }

    function setFrameZoom(frame, scale) {
      if (!frame) return;
      const state = getFrameState(frame);
      state.scale = clamp(scale, ZOOM_MIN, ZOOM_MAX);
      if (state.scale === 1) {
        state.x = 0;
        state.y = 0;
      }
      saveFrameState(frame, state);
      applyFrameTransform(frame);
    }

    function zoomCurrentImage(direction) {
      const frame = getCurrentFrame();
      if (!frame) return;
      const state = getFrameState(frame);
      setFrameZoom(frame, state.scale + direction * ZOOM_STEP);
    }

    function resetCurrentZoom() {
      const frame = getCurrentFrame();
      if (!frame) return;
      saveFrameState(frame, { scale: 1, x: 0, y: 0 });
      applyFrameTransform(frame);
    }

    function resetAllZoom() {
      document.querySelectorAll(".image-frame").forEach((frame) => {
        saveFrameState(frame, { scale: 1, x: 0, y: 0 });
        applyFrameTransform(frame);
        frame.classList.remove("is-dragging");
      });
      syncCarouselZoomState();
      updateZoomValue();
    }

    function enableImageZoom(frame) {
      let dragging = false;
      let startX = 0;
      let startY = 0;
      let baseX = 0;
      let baseY = 0;

      frame.addEventListener("wheel", function (event) {
        event.preventDefault();
        const state = getFrameState(frame);
        const direction = event.deltaY < 0 ? 1 : -1;
        setFrameZoom(frame, state.scale + direction * ZOOM_STEP);
      }, { passive: false });

      frame.addEventListener("dblclick", function () {
        const state = getFrameState(frame);
        setFrameZoom(frame, state.scale > 1 ? 1 : 2);
      });

      frame.addEventListener("pointerdown", function (event) {
        const state = getFrameState(frame);
        if (state.scale <= 1) return;
        dragging = true;
        startX = event.clientX;
        startY = event.clientY;
        baseX = state.x;
        baseY = state.y;
        frame.classList.add("is-dragging");
        frame.setPointerCapture(event.pointerId);
        event.preventDefault();
      });

      frame.addEventListener("pointermove", function (event) {
        if (!dragging) return;
        const state = getFrameState(frame);
        state.x = baseX + event.clientX - startX;
        state.y = baseY + event.clientY - startY;
        saveFrameState(frame, state);
        applyFrameTransform(frame);
      });

      function finishDrag(event) {
        if (!dragging) return;
        dragging = false;
        frame.classList.remove("is-dragging");
        try { frame.releasePointerCapture(event.pointerId); } catch (error) {}
      }

      frame.addEventListener("pointerup", finishDrag);
      frame.addEventListener("pointercancel", finishDrag);
      frame.addEventListener("pointerleave", function (event) {
        if (dragging && event.buttons === 0) finishDrag(event);
      });
    }


    function loadFrameImage(frame) {
      if (!frame) return;
      const img = frame.querySelector("img[data-src]");
      if (!img || img.getAttribute("src")) return;
      img.src = img.dataset.src;
    }

    function renderModalImages(images, itemText) {
      const modalImages = document.getElementById("modalImages");
      const modalFallback = document.getElementById("modalFallback");
      const toolbar = document.getElementById("carouselToolbar");
      if (!modalImages || !modalFallback) return;

      modalImages.innerHTML = "";
      modalFallback.style.display = "none";
      if (toolbar) toolbar.classList.remove("show");

      const imageEntries = (images || []).map((entry, index) => (
        typeof entry === "string"
          ? { src: entry, imageIndex: index, kind: "base" }
          : entry
      ));

      if (!imageEntries.length) {
        modalFallback.style.display = "block";
        modalFallback.textContent = "Nenhuma imagem foi vinculada para este item. Clique em Adicionar imagem para incluir uma referência.";
        return;
      }

      const carousel = document.createElement("div");
      carousel.className = "image-carousel";
      carousel.id = "imageCarousel";

      imageEntries.forEach((entry, index) => {
        const frame = document.createElement("figure");
        frame.className = "image-frame";
        frame.dataset.scale = "1";
        frame.dataset.x = "0";
        frame.dataset.y = "0";
        frame.dataset.imageIndex = String(entry.imageIndex ?? index);
        frame.dataset.imageKind = entry.kind || "base";

        const img = document.createElement("img");
        img.dataset.src = entry.src;
        img.alt = `${itemText} - imagem ${index + 1}`;
        img.loading = "lazy";
        img.onerror = function () {
          img.style.display = "none";
          const error = frame.querySelector(".image-error");
          if (error) error.style.display = "block";
        };

        const error = document.createElement("div");
        error.className = "image-error";
        error.textContent = "Imagem não encontrada no pacote.";

        frame.appendChild(img);
        frame.appendChild(error);
        enableImageZoom(frame);
        carousel.appendChild(frame);
        if (index === 0) loadFrameImage(frame);
      });

      carousel.addEventListener("scroll", function () {
        window.requestAnimationFrame(function () {
          const currentFrame = getCurrentFrame();
          loadFrameImage(currentFrame);
          updateZoomValue(currentFrame);
        });
      });
      modalImages.appendChild(carousel);
      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            loadFrameImage(entry.target);
            observer.unobserve(entry.target);
          });
        }, { root: carousel, threshold: 0.1 });
        carousel.querySelectorAll(".image-frame").forEach((frame) => observer.observe(frame));
      }
      updateZoomValue();
      if (toolbar && imageEntries.length > 1) toolbar.classList.add("show");
    }

    function moveCarousel(direction) {
      const carousel = document.getElementById("imageCarousel");
      if (!carousel) return;
      resetAllZoom();
      const frames = Array.from(carousel.querySelectorAll(".image-frame"));
      const current = getCurrentFrame();
      const currentIndex = Math.max(0, frames.indexOf(current));
      const targetIndex = clamp(currentIndex + direction, 0, Math.max(0, frames.length - 1));
      const target = frames[targetIndex];
      if (!target) return;
      loadFrameImage(target);
      carousel.scrollTo({ left: target.offsetLeft, behavior: "smooth" });
    }

    function renderInfo() {
      const items = guidanceItems.map((item) => `<li class="guidance-item">${escapeHtml(item)}</li>`).join("");
      return `<ul class="guidance-list">${items}</ul>`;
    }

    function renderTags(tags) {
      if (!Array.isArray(tags) || !tags.length) return "";
      const content = tags.map((tag) => `<span class="payer-tag">${escapeHtml(tag)}</span>`).join("");
      return `<span class="item-tags">${content}</span>`;
    }

    function renderItems(type, items) {
      return (items || []).map((item) => {
        const text = getItemText(item);
        const note = item.note ? `<span class="item-note">${escapeHtml(item.note)}</span>` : "";
        return `
          <li class="item">
            <button class="item-row" type="button" data-checklist-type="${escapeHtml(type)}" data-item-id="${escapeHtml(item.id)}" aria-label="Abrir referência do item: ${escapeHtml(text)}">
              <span class="item-circle" aria-hidden="true"></span>
              <span class="item-copy">
                <span class="item-main">${itemHtml(item)}</span>${renderTags(item.tags)}
                ${note}
              </span>
            </button>
          </li>
        `;
      }).join("");
    }

    function renderSection(type, section) {
      const items = renderItems(type, section.items);
      if (section.variant === "stage") {
        const description = section.description ? `<div class="stage-description">${escapeHtml(section.description)}</div>` : "";
        return `
          <section class="stage">
            <div class="stage-title"><span class="stage-check" aria-hidden="true"></span>${escapeHtml(section.title)}</div>
            ${description}
            <ul class="items-list">${items}</ul>
          </section>
        `;
      }

      const notice = section.notice ? `<div class="notice-box"><strong>Atenção — </strong>${escapeHtml(section.notice)}</div>` : "";
      const number = section.number === undefined ? "" : `<span class="section-number">${escapeHtml(section.number)}</span>`;
      return `
        <section class="section">
          <div class="section-title">${number}<span>${escapeHtml(section.title)}</span></div>
          ${notice}
          <ul class="items-list">${items}</ul>
        </section>
      `;
    }

    function renderChecklist(type) {
      const checklist = checklists[type];
      if (!checklist) return;

      document.getElementById("checklistSubtitle").textContent = `Revisão de Prontuário — ${checklist.title}`;
      document.getElementById("infoBox").innerHTML = renderInfo();
      document.getElementById("noticeBox").innerHTML = checklist.introNotice
        ? `<div class="notice-box checklist-intro-notice"><strong>Atenção — </strong>${escapeHtml(checklist.introNotice)}</div>`
        : "";
      document.getElementById("checklistContent").innerHTML = checklist.sections.map((section) => renderSection(type, section)).join("");
      document.title = `Checklist de Prontuário — ${checklist.title}`;
    }

    function customRecordHasImages(record) {
      const normalized = normalizeCustomImageRecord(record);
      return normalized.additions.length > 0 || Object.keys(normalized.replacements).length > 0;
    }

    async function getItemCustomRecord(itemKey, legacyKey) {
      const scopedRecord = await getCustomImageRecord(itemKey);
      if (customRecordHasImages(scopedRecord) || !legacyKey || legacyKey === itemKey) return scopedRecord;
      const legacyRecord = await getCustomImageRecord(legacyKey);
      return customRecordHasImages(legacyRecord) ? legacyRecord : scopedRecord;
    }

    async function openModal(type, itemId, triggerElement) {
      const requestId = ++modalRequestId;
      const overlay = document.getElementById("imageModal");
      const modalTitle = document.getElementById("modalTitle");
      const modalCaption = document.getElementById("modalCaption");
      if (!overlay) return;

      const item = findChecklistItem(type, itemId);
      if (!item) return;
      const itemText = getItemText(item);

      document.querySelectorAll(".item.active").forEach((item) => item.classList.remove("active"));
      const itemElement = triggerElement ? triggerElement.closest(".item") : null;
      if (itemElement) itemElement.classList.add("active");

      const referenceData = getReferenceData(type, item);
      const itemKey = `${type}:${item.id}`;
      const legacyKey = normalizeText(itemText);
      const customRecord = await getItemCustomRecord(itemKey, legacyKey);
      if (requestId !== modalRequestId) return;

      currentModalState = {
        type,
        itemId: item.id,
        itemText,
        itemKey,
        legacyKey,
        baseImages: referenceData.images || [],
        customRecord,
        title: referenceData.title,
        triggerElement
      };

      modalTitle.textContent = referenceData.title;
      modalCaption.textContent = itemText;
      renderModalImages(composeImageEntries(currentModalState.baseImages, customRecord), itemText);

      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      const closeButton = document.getElementById("modalClose");
      if (closeButton) closeButton.focus({ preventScroll: true });
    }

    function closeModal() {
      const overlay = document.getElementById("imageModal");
      const modalImages = document.getElementById("modalImages");
      if (!overlay) return;
      modalRequestId++;
      const triggerElement = currentModalState && currentModalState.triggerElement;
      resetAllZoom();
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      if (modalImages) modalImages.innerHTML = "";
      currentModalState = null;
      pendingImageAction = null;
      updateZoomValue();
      if (triggerElement && typeof triggerElement.focus === "function") {
        triggerElement.focus({ preventScroll: true });
      }
    }

    document.getElementById("checklistContent").addEventListener("click", function (event) {
      const row = event.target.closest(".item-row");
      if (!row) return;
      openModal(row.dataset.checklistType, row.dataset.itemId, row);
    });

    document.getElementById("imageModal").addEventListener("click", function (event) {
      if (event.target === this) closeModal();
    });

    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("zoomIn").addEventListener("click", function () { zoomCurrentImage(1); });
    document.getElementById("zoomOut").addEventListener("click", function () { zoomCurrentImage(-1); });
    document.getElementById("zoomReset").addEventListener("click", resetCurrentZoom);
    document.getElementById("addImageBtn").addEventListener("click", function () { chooseImageFile("add"); });
    document.getElementById("replaceImageBtn").addEventListener("click", function () { chooseImageFile("replace"); });
    document.getElementById("removeCustomImageBtn").addEventListener("click", removeCurrentCustomImage);
    document.getElementById("imageFileInput").addEventListener("change", function () { handleSelectedImageFiles(this.files); });
    document.getElementById("carouselPrev").addEventListener("click", function () { moveCarousel(-1); });
    document.getElementById("carouselNext").addEventListener("click", function () { moveCarousel(1); });

    document.addEventListener("keydown", function (event) {
      const overlay = document.getElementById("imageModal");
      const modalOpen = overlay && overlay.classList.contains("show");
      if (event.key === "Escape") closeModal();
      if (!modalOpen) return;
      if (event.key === "+" || event.key === "=") zoomCurrentImage(1);
      if (event.key === "-" || event.key === "_") zoomCurrentImage(-1);
      if (event.key === "0") resetCurrentZoom();
    });

    document.getElementById("checklistType").addEventListener("change", function () {
      renderChecklist(this.value);
    });

    renderChecklist("cirurgico");
  </script>
</body>
